version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - lll
    - nilnil
    - noctx
    - revive
  settings:
    lll:
      line-length: 99
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - lll
      # templ components take their context from Render(ctx); contextcheck cannot see that
      # and flags every page built in a handler.
      - path: internal/web/
        linters:
          - contextcheck
        text: "Page->"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jalet/matlistan
