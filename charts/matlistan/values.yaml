image:
  repository: ghcr.io/jalet/matlistan
  # Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Public address, https (required). The OIDC callback is <baseURL>/auth/callback.
baseURL: ""

# en or sv: the language of the UI, the generated recipes and the Shortcut export.
locale: en
# IANA time zone for week boundaries and the CronJob.
timezone: UTC

database:
  # Secret with the PostgreSQL URL (required). A CNPG app secret works with caSecret.
  urlSecret:
    name: ""
    key: uri
  # Secret with the database CA (for CNPG: <cluster>-ca). When set, the app refuses any
  # connection that is not TLS verified against it.
  caSecret:
    name: ""
    key: ca.crt

oidc:
  issuer: ""
  clientID: matlistan
  clientSecret:
    name: ""
    key: client-secret
  # Optional ConfigMap with an extra CA bundle for the IdP.
  caConfigMap:
    name: ""
    key: ca.crt

auth:
  claim: groups
  # Claim values allowed to sign in (required). Values must not contain commas.
  allowed: []

session:
  # At least 32 random bytes.
  keySecret:
    name: ""
    key: key

anthropic:
  # Secret with the Anthropic API key (required): the web UI and the CronJob plan with it.
  apiKeySecret:
    name: ""
    key: api-key
  # Empty uses the app default.
  model: ""

# The Sunday draft. The job plans the upcoming week and does nothing when it is planned.
generate:
  enabled: true
  schedule: "0 7 * * 0"

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 256Mi

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []

networkPolicy:
  enabled: true
  # Set these selectors to your Gateway's pods; the empty defaults allow any pod.
  gateway:
    namespaceSelector: {}
    podSelector: {}
  metricsScraper:
    namespaceSelector: {}
    podSelector: {}
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  database:
    namespaceSelector: {}
    podSelector: {}
    port: 5432
  # The IdP and api.anthropic.com, both on 443.
  https:
    cidrs:
      - 0.0.0.0/0
    port: 443

serviceMonitor:
  enabled: false

# Optional color overrides; keys left out keep the built-in colors. Quote every value: an
# unquoted #fff is a YAML comment. Keys for light and dark: page, panel, line, ink, muted,
# focus, primary, primaryInk, attention, attentionText, day1..day7 (Monday is 1) and
# day1Ink..day7Ink. Values are #rgb, #rrggbb or #rrggbbaa. Changing the theme restarts the
# pod.
theme: {}
