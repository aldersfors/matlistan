[tools]
go = "1.26.7"
golangci-lint = "2.14.0"
ko = "0.19.1"
helm = "4.3.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.5.0"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1020"
"github:tailwindlabs/tailwindcss" = { version = "4.3.3", bin = "tailwindcss" }

[env]
# Tests terminate their own containers; the Ryuk reaper does not start under rootless Podman.
TESTCONTAINERS_RYUK_DISABLED = "true"

[tasks.fmt]
run = "golangci-lint fmt"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = "go test -race -shuffle=on ./..."

[tasks.vuln]
run = "govulncheck ./..."

[tasks.templ]
description = "Generate Go code from .templ files"
run = "templ generate"

[tasks."templ:check"]
description = "Fail if generated templ code is stale"
run = "mise run templ && git diff --exit-code -- '*_templ.go'"

[tasks.css]
description = "Compile Tailwind into internal/web/static/app.css"
run = "tailwindcss -i web/styles/input.css -o internal/web/static/app.css --minify"

[tasks."css:check"]
description = "Fail if the committed CSS is stale"
run = "mise run css && git diff --exit-code -- internal/web/static/app.css"

[tasks.build]
run = "ko build --local ./cmd/matlistan"
